<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="670" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Merske lestvice</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P01: vsaka višja vsebuje vse nižje</text><rect x="20" y="434" width="600" height="104" rx="12" fill="#F1EFE8" stroke="#888" stroke-width="1.8"/><text x="36" y="464"  font-size="20" font-weight="bold" fill="#444">imenska (nominalna)</text><text x="36" y="492"  font-size="17" fill="#333">enakost: =, ≠   ·   spol, kraj, hišna št.</text><text x="36" y="518"  font-size="17" fill="#333">frekvence, modus</text><rect x="34" y="316" width="572" height="104" rx="12" fill="#FBF1D3" stroke="#B08900" stroke-width="1.8"/><text x="50" y="346"  font-size="20" font-weight="bold" fill="#8a6d00">urejenostna (ordinalna)</text><text x="50" y="374"  font-size="17" fill="#333">urejenost: ≤, ≥   ·   izobrazba, ocena</text><text x="50" y="400"  font-size="17" fill="#333">+ mediana, rang, kvantili</text><rect x="48" y="198" width="544" height="104" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="64" y="228"  font-size="20" font-weight="bold" fill="#1F5FC4">razmična (intervalna)</text><text x="64" y="256"  font-size="17" fill="#333">razlika: y_A − y_B   ·   temperatura v °C</text><text x="64" y="282"  font-size="17" fill="#333">+ povprečje, σ, korelacija</text><rect x="62" y="80" width="516" height="104" rx="12" fill="#E2F3E8" stroke="#2E7D32" stroke-width="1.8"/><text x="78" y="110"  font-size="20" font-weight="bold" fill="#2E7D32">razmernostna (racionalna)</text><text x="78" y="138"  font-size="17" fill="#333">razmerje: y_A / y_B   ·   prihodek, starost</text><text x="78" y="164"  font-size="17" fill="#333">+ KV, geom. in harm. sredina</text><rect x="20" y="560" width="600" height="109" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="590" font-size="18.5" fill="#C0392B" font-weight="bold">hišna številka je število, a imenska lestvica!</text><text x="38" y="621" font-size="18.5" fill="#222" >ordinalna: vrstni red znan, razdalje ne</text><text x="38" y="652" font-size="18.5" fill="#222" >intervalna: ničla dogovorjena (20 °C ni »2-krat toplejše«)</text></svg>