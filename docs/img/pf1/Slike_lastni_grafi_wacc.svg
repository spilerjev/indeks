<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 524" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="524" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Tehtani povprečni strošek kapitala</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P07: WACC = r_E · E/V + r_D · (1 − t) · D/V</text><rect x="40" y="84" width="260" height="170" rx="12" fill="#F8E1D6" stroke="#B5651D" stroke-width="1.8"/><text x="170" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#B5651D">Lastniški kapital E</text><text x="170" y="150" text-anchor="middle" font-size="17" fill="#333">r_E (CAPM ali</text><text x="170" y="174" text-anchor="middle" font-size="17" fill="#333">obrnjen Gordon)</text><text x="170" y="198" text-anchor="middle" font-size="17" fill="#333">npr. 10 %, delež 50 %</text><rect x="340" y="84" width="260" height="170" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="470" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F5FC4">Dolg D</text><text x="470" y="150" text-anchor="middle" font-size="17" fill="#333">r_D · (1 − t)</text><text x="470" y="174" text-anchor="middle" font-size="17" fill="#333">davčni ščit obresti</text><text x="470" y="198" text-anchor="middle" font-size="17" fill="#333">npr. 4 %, delež 50 %</text><line x1="170" y1="254" x2="320" y2="300" stroke="#555" stroke-width="2.5"/><line x1="470" y1="254" x2="320" y2="300" stroke="#555" stroke-width="2.5"/><rect x="150" y="300" width="340" height="84" rx="12" fill="#E2F3E8" stroke="#2E7D32" stroke-width="1.8"/><text x="320" y="334" text-anchor="middle" font-size="20" font-weight="bold" fill="#2E7D32">WACC = 0,5·10 + 0,5·4 = 7 %</text><text x="320" y="364" text-anchor="middle" font-size="17" fill="#333">diskontna stopnja za FCF</text><rect x="20" y="410" width="600" height="109" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="440" font-size="18.5" fill="#222" >uteži po tržnih vrednostih (ne knjigovodskih)</text><text x="38" y="471" font-size="18.5" fill="#222" font-weight="bold">projekt primerjaj z WACC, ne z obrestno mero posojila</text><text x="38" y="502" font-size="18.5" fill="#222" >donosnost projekta 6 % &lt; WACC 7 % → zavrni</text></svg>