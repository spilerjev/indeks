<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 628" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="628" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">CAPM in premica SML</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P06: E[rᵢ] = r_f + βᵢ · (E[r_m] − r_f)</text><line x1="80" y1="430" x2="600" y2="430" stroke="#ece7dc"/><text x="72" y="436" text-anchor="end" font-size="15" fill="#555">0</text><line x1="80" y1="362" x2="600" y2="362" stroke="#ece7dc"/><text x="72" y="368" text-anchor="end" font-size="15" fill="#555">3</text><line x1="80" y1="294" x2="600" y2="294" stroke="#ece7dc"/><text x="72" y="300" text-anchor="end" font-size="15" fill="#555">6</text><line x1="80" y1="226" x2="600" y2="226" stroke="#ece7dc"/><text x="72" y="232" text-anchor="end" font-size="15" fill="#555">9</text><line x1="80" y1="158" x2="600" y2="158" stroke="#ece7dc"/><text x="72" y="164" text-anchor="end" font-size="15" fill="#555">12</text><line x1="80" y1="90" x2="600" y2="90" stroke="#ece7dc"/><text x="72" y="96" text-anchor="end" font-size="15" fill="#555">15</text><text x="80" y="454" text-anchor="middle" font-size="15" fill="#555">0</text><text x="198.1818181818182" y="454" text-anchor="middle" font-size="15" fill="#555">0,5</text><text x="316.3636363636364" y="454" text-anchor="middle" font-size="15" fill="#555">1</text><text x="434.5454545454545" y="454" text-anchor="middle" font-size="15" fill="#555">1,5</text><text x="552.7272727272727" y="454" text-anchor="middle" font-size="15" fill="#555">2</text><line x1="80" y1="430" x2="600" y2="430" stroke="#222" stroke-width="2"/><line x1="80" y1="430" x2="80" y2="90" stroke="#222" stroke-width="2"/><text x="600" y="478" text-anchor="end" font-size="16.5" fill="#222">beta (β)</text><text x="74" y="78" font-size="16.5" fill="#222">zahtevana donosnost E[r] (%)</text><path d="M80.0 362.0L340.0 237.3L600.0 112.7" fill="none" stroke="#1F5FC4" stroke-width="3.5"/><circle cx="80" cy="362" r="6" fill="#1F5FC4"/><text x="88" y="384"  font-size="16" font-weight="bold" fill="#222">r_f = 3 %</text><circle cx="195.8181818181818" cy="306.4666666666667" r="6" fill="#1F5FC4"/><text x="205.8181818181818" y="330.4666666666667"  font-size="16" font-weight="bold" fill="#222">Coca-Cola 5,5 %</text><circle cx="316.3636363636364" cy="248.66666666666666" r="6" fill="#C0392B"/><text x="326.3636363636364" y="272.66666666666663"  font-size="16" font-weight="bold" fill="#222">trg 8 %</text><circle cx="354.18181818181813" cy="230.53333333333333" r="6" fill="#1F5FC4"/><text x="344.18181818181813" y="218.53333333333333" text-anchor="end" font-size="16" font-weight="bold" fill="#222">JPMorgan 8,8 %</text><circle cx="555.090909090909" cy="134.20000000000005" r="6" fill="#1F5FC4"/><text x="545.090909090909" y="122.20000000000005" text-anchor="end" font-size="16" font-weight="bold" fill="#222">Tesla 13 %</text><rect x="20" y="484" width="600" height="140" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="514" font-size="18.5" fill="#222" >r_f = 3 % (netvegana), premija trga (MRP) = 5 %</text><text x="38" y="545" font-size="18.5" fill="#222" >naklon SML = MRP; β = 1 → donosnost trga</text><text x="38" y="576" font-size="18.5" fill="#C0392B" font-weight="bold">E[r] je odvisna od bete, ne od celotnega σ</text><text x="38" y="607" font-size="18.5" fill="#222" >zahtevana donosnost = strošek lastniškega kapitala r_E</text></svg>