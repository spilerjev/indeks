<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="612" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Littlov zakon: Z = PČ · P</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">Vaje 2, primer 2.5: urgenca, P = 50 bolnikov/h</text><rect x="60" y="80" width="520" height="72" rx="12" fill="#F1EFE8" stroke="#888" stroke-width="1.8"/><text x="320" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#444">čakanje na prijavo</text><text x="320" y="136" text-anchor="middle" font-size="17" fill="#333">Z = 30 → PČ = 30/50 h = 36 min</text><line x1="320" y1="152" x2="320" y2="168" stroke="#555" stroke-width="2.5"/><polygon points="313,166 327,166 320,176" fill="#555"/><rect x="60" y="176" width="520" height="72" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="320" y="206" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F5FC4">prijava</text><text x="320" y="232" text-anchor="middle" font-size="17" fill="#333">2 min</text><line x1="320" y1="248" x2="320" y2="264" stroke="#555" stroke-width="2.5"/><polygon points="313,262 327,262 320,272" fill="#555"/><rect x="60" y="272" width="520" height="72" rx="12" fill="#F1EFE8" stroke="#888" stroke-width="1.8"/><text x="320" y="302" text-anchor="middle" font-size="20" font-weight="bold" fill="#444">čakanje na pregled</text><text x="320" y="328" text-anchor="middle" font-size="17" fill="#333">Z = 40 → PČ = 40/50 h = 48 min</text><line x1="320" y1="344" x2="320" y2="360" stroke="#555" stroke-width="2.5"/><polygon points="313,358 327,358 320,368" fill="#555"/><rect x="60" y="368" width="520" height="72" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="320" y="398" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F5FC4">pregled</text><text x="320" y="424" text-anchor="middle" font-size="17" fill="#333">90 %: recept 5 min · 10 %: hosp. 30 min</text><rect x="20" y="474" width="600" height="140" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="504" font-size="18.5" fill="#222" >recept: 36 + 2 + 48 + 5 = 91 min; hosp.: 116 min</text><text x="38" y="535" font-size="18.5" fill="#222" font-weight="bold">povprečni PČ = 0,9 · 91 + 0,1 · 116 = 93,5 min</text><text x="38" y="566" font-size="18.5" fill="#1F5FC4" font-weight="bold">Z = P · PČ = 50 · 93,5/60 ≈ 78 bolnikov</text><text x="38" y="597" font-size="18.5" fill="#222" >Z = zaloga, PČ = pretočni čas, P = pretok</text></svg>