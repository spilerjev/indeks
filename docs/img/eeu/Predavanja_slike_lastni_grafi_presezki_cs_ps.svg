<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="700" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Potrošnikov in proizvajalčev presežek</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P03, prosojnice 9–12 (ponovitev)</text><polygon points="70.0,90.0 304.0,261.0 70.0,261.0" fill="#7FB3E6" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><polygon points="70.0,432.0 304.0,261.0 70.0,261.0" fill="#F5A04C" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><line x1="70" y1="470" x2="590" y2="470" stroke="#222" stroke-width="2.2"/><line x1="70" y1="470" x2="70" y2="90" stroke="#222" stroke-width="2.2"/><text x="586" y="494" text-anchor="end" font-size="17" fill="#222">Q</text><text x="62" y="94" text-anchor="end" font-size="17" fill="#222">P</text><line x1="70" y1="261" x2="304" y2="261" stroke="#1F5FC4" stroke-width="2.3" /><text x="64" y="267" text-anchor="end" font-size="17" font-weight="bold" fill="#1F5FC4">P*</text><line x1="70" y1="90" x2="590" y2="470" stroke="#222" stroke-width="2.8"/><text x="586" y="462" text-anchor="end" font-size="20" font-weight="bold" fill="#222">D</text><line x1="70" y1="432" x2="486" y2="128" stroke="#C0392B" stroke-width="2.8"/><text x="490" y="132" font-size="20" font-weight="bold" fill="#C0392B">S</text><line x1="304" y1="261" x2="304" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="304" y="492" text-anchor="middle" font-size="17" fill="#333">Q*</text><text x="142.8" y="218.59999999999997" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">CS</text><text x="142.8" y="325" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">PS</text><circle cx="304" cy="261" r="5" fill="#222"/><text x="312" y="253" font-size="17" font-weight="bold" fill="#222">E</text><rect x="20" y="520" width="600" height="140" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="550" font-size="18.5" fill="#1F5FC4" >CS = nad ceno, pod krivuljo D (korist potrošnikov)</text><text x="38" y="581" font-size="18.5" fill="#B5651D" >PS = pod ceno, nad krivuljo S (korist proizvajalcev)</text><text x="38" y="612" font-size="18.5" fill="#222" >Blaginja = CS + PS, največja v ravnotežju E</text><text x="38" y="643" font-size="18.5" fill="#222" >Cena pade → CS ↑ (manj plačajo + kupijo več)</text></svg>