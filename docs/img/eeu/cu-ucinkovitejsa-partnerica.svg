<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="740" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">CU z učinkovitejšo partnerico</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">samo ustvarjanje trgovine</text><polygon points="70.0,356.0 174.0,356.0 252.0,299.0 70.0,299.0" fill="#7FB3E6" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><polygon points="174.0,356.0 252.0,356.0 252.0,299.0" fill="#E8705F" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><polygon points="252.0,356.0 356.0,356.0 356.0,299.0 252.0,299.0" fill="#F2C94C" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><polygon points="356.0,356.0 434.0,356.0 356.0,299.0" fill="#E8705F" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><line x1="70" y1="470" x2="590" y2="470" stroke="#222" stroke-width="2.2"/><line x1="70" y1="470" x2="70" y2="90" stroke="#222" stroke-width="2.2"/><text x="586" y="494" text-anchor="end" font-size="17" fill="#222">Q</text><text x="62" y="94" text-anchor="end" font-size="17" fill="#222">P</text><line x1="70" y1="299" x2="590" y2="299" stroke="#B5651D" stroke-width="2.3" stroke-dasharray="8 5"/><text x="590" y="293" text-anchor="end" font-size="17" font-weight="bold" fill="#B5651D">P_P + T</text><line x1="70" y1="356" x2="590" y2="356" stroke="#6A1B9A" stroke-width="2.3" /><text x="590" y="376" text-anchor="end" font-size="17" font-weight="bold" fill="#6A1B9A">P_P</text><line x1="70" y1="90" x2="590" y2="470" stroke="#222" stroke-width="2.8"/><text x="586" y="462" text-anchor="end" font-size="20" font-weight="bold" fill="#222">D</text><line x1="70" y1="432" x2="486" y2="128" stroke="#C0392B" stroke-width="2.8"/><text x="490" y="132" font-size="20" font-weight="bold" fill="#C0392B">S</text><line x1="174" y1="356" x2="174" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="174" y="492" text-anchor="middle" font-size="17" fill="#333">q₁</text><line x1="252" y1="299" x2="252" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="252" y="492" text-anchor="middle" font-size="17" fill="#333">q₂</text><line x1="356" y1="299" x2="356" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="356" y="492" text-anchor="middle" font-size="17" fill="#333">q₃</text><line x1="434" y1="356" x2="434" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="434" y="492" text-anchor="middle" font-size="17" fill="#333">q₄</text><text x="132.4" y="334.5" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">A</text><text x="231.2" y="349.7" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">B</text><text x="304" y="334.5" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">C</text><text x="376.8" y="349.7" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">D</text><rect x="20" y="520" width="600" height="202" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="550" font-size="18.5" fill="#222" >P je najcenejša (P_P &lt; P_W): uvoz že prej iz P</text><text x="38" y="581" font-size="18.5" fill="#222" >po CU: carina T na uvoz iz P odpade</text><text x="38" y="612" font-size="18.5" fill="#222" >ΔPP = +(A + B + C + D)    ΔPRP = −A</text><text x="38" y="643" font-size="18.5" fill="#222" >ΔJF = −C</text><text x="38" y="674" font-size="18.5" fill="#2E7D32" font-weight="bold">ΔW = B + D &gt; 0 (enako kot MFN liberalizacija)</text><text x="38" y="705" font-size="18.5" fill="#222" >ni preusmerjanja trgovine</text></svg>