<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="620" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Učinek carinske unije EGS</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P05: uvoz EGS-6 1958 → 1970 (odčitano z grafov)</text><text x="150" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Delež uvoza po poreklu</text><rect x="40" y="330" width="110" height="90" fill="#1F5FC4"/><text x="95" y="381" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">EGS 30 %</text><rect x="40" y="306" width="110" height="24" fill="#888"/><rect x="40" y="120" width="110" height="186" fill="#C0392B"/><text x="95" y="219" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">svet 62 %</text><text x="95" y="446" text-anchor="middle" font-size="18" fill="#222">1958</text><rect x="160" y="276" width="110" height="144" fill="#1F5FC4"/><text x="215" y="354" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">EGS 48 %</text><rect x="160" y="255" width="110" height="21" fill="#888"/><rect x="160" y="120" width="110" height="135" fill="#C0392B"/><text x="215" y="193.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">svet 45 %</text><text x="215" y="446" text-anchor="middle" font-size="18" fill="#222">1970</text><text x="470" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Uvoz (mrd $)</text><rect x="360" y="347.4" width="58" height="72.6" fill="#888"/><text x="389" y="339.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">22</text><rect x="420" y="396.9" width="58" height="23.099999999999998" fill="#1F5FC4"/><text x="449" y="388.9" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">7</text><rect x="500" y="129.60000000000002" width="58" height="290.4" fill="#888"/><text x="529" y="121.60000000000002" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">88</text><rect x="560" y="278.1" width="58" height="141.9" fill="#1F5FC4"/><text x="589" y="270.1" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">43</text><text x="419" y="446" text-anchor="middle" font-size="18">1958</text><text x="559" y="446" text-anchor="middle" font-size="18">1970</text><rect x="20" y="468" width="600" height="140" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="498" font-size="18.5" fill="#222" >siva = celotni uvoz, modra = uvoz znotraj EGS</text><text x="38" y="529" font-size="18.5" fill="#1F5FC4" font-weight="bold">uvoz znotraj EGS ×6, celotni ×4 → ustvarjanje</text><text x="38" y="560" font-size="18.5" fill="#C0392B" >delež sveta pade → možno preusmerjanje</text><text x="38" y="591" font-size="18.5" fill="#222" >tanka siva plast = drugih 6 evropskih (≈ 8 %)</text></svg>