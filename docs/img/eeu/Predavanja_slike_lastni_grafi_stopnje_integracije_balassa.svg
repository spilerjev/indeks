<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="634" fill="#fff"/><text x="320" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#222">Stopnje ekonomske integracije</text><text x="320" y="64" text-anchor="middle" font-size="17" fill="#666">Balassa (1961), od najnižje (spodaj) do najvišje</text><rect x="20" y="474" width="600" height="84" rx="10" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.5"/><text x="36" y="504" font-size="21" font-weight="bold" fill="#123">1. Območje proste trgovine (FTA)</text><text x="36" y="532" font-size="17.5" fill="#234">odprava carin med članicami</text><text x="606" y="532" text-anchor="end" font-size="16" font-style="italic" fill="#8a3b12">EFTA, CEFTA</text><rect x="38" y="378" width="564" height="84" rx="10" fill="#CFE2F5" stroke="#4a78b0" stroke-width="1.5"/><text x="54" y="408" font-size="21" font-weight="bold" fill="#123">2. Carinska unija (CU)</text><text x="54" y="436" font-size="17.5" fill="#234">+ skupna zunanja carinska tarifa</text><text x="588" y="436" text-anchor="end" font-size="16" font-style="italic" fill="#8a3b12">EGS 1968</text><rect x="56" y="282" width="528" height="84" rx="10" fill="#B7D3EF" stroke="#4a78b0" stroke-width="1.5"/><text x="72" y="312" font-size="21" font-weight="bold" fill="#123">3. Skupni (notranji) trg</text><text x="72" y="340" font-size="17.5" fill="#234">+ prost pretok storitev, dela, kapitala</text><text x="570" y="340" text-anchor="end" font-size="16" font-style="italic" fill="#8a3b12">enotni trg 1993</text><rect x="74" y="186" width="492" height="84" rx="10" fill="#9CC2E8" stroke="#4a78b0" stroke-width="1.5"/><text x="90" y="216" font-size="21" font-weight="bold" fill="#123">4. Ekonomska unija</text><text x="90" y="244" font-size="17.5" fill="#234">+ usklajevanje ekonomskih politik</text><text x="552" y="244" text-anchor="end" font-size="16" font-style="italic" fill="#8a3b12">EU (delno)</text><rect x="92" y="90" width="456" height="84" rx="10" fill="#7FB0E0" stroke="#4a78b0" stroke-width="1.5"/><text x="108" y="120" font-size="21" font-weight="bold" fill="#123">5. Ekonomska in monetarna unija</text><text x="108" y="148" font-size="17.5" fill="#234">+ skupna valuta in centralna banka</text><text x="534" y="148" text-anchor="end" font-size="16" font-style="italic" fill="#8a3b12">evro 1999/2002</text><text x="320" y="596" text-anchor="middle" font-size="17" fill="#555">Vsaka višja stopnja vsebuje vse nižje.</text><text x="320" y="620" text-anchor="middle" font-size="17" fill="#555">FTA ↔ CU: pri CU skupna carina do nečlanic (brez pravil o poreklu).</text></svg>