<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="420" fill="#fff"/><text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Stopnje ekonomske integracije (Balassa, 1961)</text><rect x="40" y="330" width="820" height="54" rx="8" fill="#E3EEF9" stroke="#4a78b0"/><text x="54" y="353" font-size="16" font-weight="bold" fill="#123">1. Območje proste trgovine (FTA)</text><text x="54" y="374" font-size="13.5" fill="#234">odprava carin med članicami</text><text x="846" y="363" text-anchor="end" font-size="13.5" font-style="italic" fill="#8a3b12">EFTA, CEFTA</text><rect x="110" y="268" width="750" height="54" rx="8" fill="#CFE2F5" stroke="#4a78b0"/><text x="124" y="291" font-size="16" font-weight="bold" fill="#123">2. Carinska unija (CU)</text><text x="124" y="312" font-size="13.5" fill="#234">+ skupna zunanja carinska tarifa</text><text x="846" y="301" text-anchor="end" font-size="13.5" font-style="italic" fill="#8a3b12">EGS 1968</text><rect x="180" y="206" width="680" height="54" rx="8" fill="#B7D3EF" stroke="#4a78b0"/><text x="194" y="229" font-size="16" font-weight="bold" fill="#123">3. Skupni (notranji) trg</text><text x="194" y="250" font-size="13.5" fill="#234">+ prost pretok storitev, dela in kapitala</text><text x="846" y="239" text-anchor="end" font-size="13.5" font-style="italic" fill="#8a3b12">enotni trg 1993</text><rect x="250" y="144" width="610" height="54" rx="8" fill="#9CC2E8" stroke="#4a78b0"/><text x="264" y="167" font-size="16" font-weight="bold" fill="#123">4. Ekonomska unija</text><text x="264" y="188" font-size="13.5" fill="#234">+ usklajevanje ekonomskih politik</text><text x="846" y="177" text-anchor="end" font-size="13.5" font-style="italic" fill="#8a3b12">EU (delno)</text><rect x="320" y="82" width="540" height="54" rx="8" fill="#7FB0E0" stroke="#4a78b0"/><text x="334" y="105" font-size="16" font-weight="bold" fill="#123">5. Ekonomska in monetarna unija (EMU)</text><text x="334" y="126" font-size="13.5" fill="#234">+ skupna valuta (evro) in centralna banka (ECB)</text><text x="846" y="115" text-anchor="end" font-size="13.5" font-style="italic" fill="#8a3b12">evro 1999/2002</text><text x="450" y="406" text-anchor="middle" font-size="13" fill="#555">Vsaka višja stopnja vsebuje vse elemente nižjih. Razlika FTA ↔ CU: pri CU skupna carina do nečlanic (ni pravil o poreklu).</text></svg>