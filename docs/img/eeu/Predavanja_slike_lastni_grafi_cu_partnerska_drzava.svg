<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="740" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Učinek CU na partnersko državo</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P05, slika 2.7: cena izvoza zraste s P_W na P_CU</text><polygon points="70.0,261.0 252.0,261.0 200.0,223.0 70.0,223.0" fill="#7FB3E6" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><polygon points="252.0,261.0 356.0,261.0 408.0,223.0 200.0,223.0" fill="#6FCF97" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><line x1="70" y1="470" x2="590" y2="470" stroke="#222" stroke-width="2.2"/><line x1="70" y1="470" x2="70" y2="90" stroke="#222" stroke-width="2.2"/><text x="586" y="494" text-anchor="end" font-size="17" fill="#222">Q</text><text x="62" y="94" text-anchor="end" font-size="17" fill="#222">P</text><line x1="70" y1="223" x2="590" y2="223" stroke="#2E7D32" stroke-width="2.3" /><text x="64" y="229" text-anchor="end" font-size="17" font-weight="bold" fill="#2E7D32">P_CU</text><line x1="70" y1="261" x2="590" y2="261" stroke="#1F5FC4" stroke-width="2.3" stroke-dasharray="8 5"/><text x="64" y="267" text-anchor="end" font-size="17" font-weight="bold" fill="#1F5FC4">P_W</text><line x1="70" y1="128" x2="538" y2="470" stroke="#222" stroke-width="2.8"/><text x="534" y="462" text-anchor="end" font-size="20" font-weight="bold" fill="#222">D</text><line x1="70" y1="470" x2="512" y2="147" stroke="#C0392B" stroke-width="2.8"/><text x="516" y="151" font-size="20" font-weight="bold" fill="#C0392B">S</text><line x1="200" y1="223" x2="200" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="200" y="492" text-anchor="middle" font-size="17" fill="#333">q₅</text><line x1="252" y1="261" x2="252" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="252" y="492" text-anchor="middle" font-size="17" fill="#333">q₆</text><line x1="356" y1="261" x2="356" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="356" y="492" text-anchor="middle" font-size="17" fill="#333">q₇</text><line x1="408" y1="223" x2="408" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="408" y="492" text-anchor="middle" font-size="17" fill="#333">q₈</text><text x="142.8" y="256.6" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">I</text><text x="304" y="256.6" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">J</text><rect x="20" y="520" width="600" height="202" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="550" font-size="18.5" fill="#222" >izvoz: q₇ − q₆  →  q₈ − q₅ (večji)</text><text x="38" y="581" font-size="18.5" fill="#222" >ΔPP = −I    ΔPRP = +(I + J)</text><text x="38" y="612" font-size="18.5" fill="#2E7D32" font-weight="bold">ΔW = J &gt; 0 (vedno pozitivno)</text><text x="38" y="643" font-size="18.5" fill="#222" >1) višja izvozna cena (boljši pogoji menjave)</text><text x="38" y="674" font-size="18.5" fill="#222" >2) večji obseg izvoza</text><text x="38" y="705" font-size="18.5" fill="#C0392B" >ROW: izvoz v CU in cena padeta → izguba</text></svg>