<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="720" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Koristi trgovine: država izvoznica</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P_W &gt; P_F*</text><polygon points="70.0,261.0 304.0,261.0 226.0,204.0 70.0,204.0" fill="#7FB3E6" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><polygon points="226.0,204.0 304.0,261.0 382.0,204.0" fill="#6FCF97" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><line x1="70" y1="470" x2="590" y2="470" stroke="#222" stroke-width="2.2"/><line x1="70" y1="470" x2="70" y2="90" stroke="#222" stroke-width="2.2"/><text x="586" y="494" text-anchor="end" font-size="17" fill="#222">Q</text><text x="62" y="94" text-anchor="end" font-size="17" fill="#222">P</text><line x1="70" y1="204" x2="590" y2="204" stroke="#1F5FC4" stroke-width="2.3" /><text x="64" y="210" text-anchor="end" font-size="17" font-weight="bold" fill="#1F5FC4">P_W</text><line x1="70" y1="261" x2="304" y2="261" stroke="#555" stroke-width="2.3" stroke-dasharray="8 5"/><text x="64" y="267" text-anchor="end" font-size="17" font-weight="bold" fill="#555">P_F*</text><line x1="70" y1="90" x2="590" y2="470" stroke="#222" stroke-width="2.8"/><text x="586" y="462" text-anchor="end" font-size="20" font-weight="bold" fill="#222">D</text><line x1="70" y1="432" x2="486" y2="128" stroke="#C0392B" stroke-width="2.8"/><text x="490" y="132" font-size="20" font-weight="bold" fill="#C0392B">S</text><line x1="226" y1="204" x2="226" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="226" y="492" text-anchor="middle" font-size="17" fill="#333">q₁</text><line x1="304" y1="261" x2="304" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="304" y="492" text-anchor="middle" font-size="17" fill="#333">q*</text><line x1="382" y1="204" x2="382" y2="470" stroke="#888" stroke-dasharray="5 5"/><text x="382" y="492" text-anchor="middle" font-size="17" fill="#333">q₂</text><text x="153.2" y="245.20000000000002" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">ABED</text><text x="304" y="233.79999999999998" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">BEC</text><circle cx="70" cy="204" r="5" fill="#222"/><text x="78" y="196" font-size="17" font-weight="bold" fill="#222">A</text><circle cx="226" cy="204" r="5" fill="#222"/><text x="204" y="196" font-size="17" font-weight="bold" fill="#222">B</text><circle cx="382" cy="204" r="5" fill="#222"/><text x="390" y="196" font-size="17" font-weight="bold" fill="#222">C</text><circle cx="70" cy="261" r="5" fill="#222"/><text x="78" y="283" font-size="17" font-weight="bold" fill="#222">D</text><circle cx="304" cy="261" r="5" fill="#222"/><text x="310" y="285" font-size="17" font-weight="bold" fill="#222">E</text><rect x="20" y="520" width="600" height="171" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="550" font-size="18.5" fill="#222" >cena zraste s P_F* na P_W, izvoz = q₂ − q₁</text><text x="38" y="581" font-size="18.5" fill="#1F5FC4" >potrošniki: − ABED (izgubijo, modro)</text><text x="38" y="612" font-size="18.5" fill="#B5651D" >proizvajalci: + ACED (pridobijo)</text><text x="38" y="643" font-size="18.5" fill="#2E7D32" font-weight="bold">neto korist = trikotnik BEC &gt; 0</text><text x="38" y="674" font-size="18.5" fill="#222" >prerazdelitev od potrošnikov k proizvajalcem</text></svg>