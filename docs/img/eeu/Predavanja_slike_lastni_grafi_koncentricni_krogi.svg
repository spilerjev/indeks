<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="860" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Dva kroga v zahodni Evropi</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P01: od ločenih blokov (1960) do prekrivanja (1973)</text><text x="320" y="100" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">1960–1972: ločena kroga</text><circle cx="170" cy="230" r="105" fill="#1F5FC4" fill-opacity="0.18" stroke="#1F5FC4" stroke-width="3"/><text x="170" y="160" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F5FC4">EGS-6 (CU)</text><text x="140" y="205" text-anchor="middle" font-size="19" fill="#222">F</text><text x="200" y="205" text-anchor="middle" font-size="19" fill="#222">D</text><text x="140" y="250" text-anchor="middle" font-size="19" fill="#222">I</text><text x="200" y="250" text-anchor="middle" font-size="19" fill="#222">B</text><text x="150" y="292" text-anchor="middle" font-size="19" fill="#222">NL</text><text x="195" y="292" text-anchor="middle" font-size="19" fill="#222">L</text><circle cx="470" cy="230" r="105" fill="#C0392B" fill-opacity="0.18" stroke="#C0392B" stroke-width="3"/><text x="470" y="160" text-anchor="middle" font-size="20" font-weight="bold" fill="#C0392B">EFTA-7 (FTA)</text><text x="435" y="200" text-anchor="middle" font-size="19" fill="#222">VB</text><text x="505" y="200" text-anchor="middle" font-size="19" fill="#222">DK</text><text x="420" y="245" text-anchor="middle" font-size="19" fill="#222">N</text><text x="470" y="245" text-anchor="middle" font-size="19" fill="#222">S</text><text x="520" y="245" text-anchor="middle" font-size="19" fill="#222">A</text><text x="445" y="290" text-anchor="middle" font-size="19" fill="#222">CH</text><text x="500" y="290" text-anchor="middle" font-size="19" fill="#222">P</text><text x="320" y="362" text-anchor="middle" font-size="16.5" fill="#666">zunaj: IRL, FIN, ES, GR, IS</text><text x="320" y="412" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">1973: prekrivajoča se kroga</text><ellipse cx="340" cy="565" rx="285" ry="125" fill="#C0392B" fill-opacity="0.08" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 6"/><circle cx="215" cy="565" r="108" fill="#1F5FC4" fill-opacity="0.18" stroke="#1F5FC4" stroke-width="3"/><text x="215" y="498" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F5FC4">EGS-9 (CU)</text><text x="215" y="545" text-anchor="middle" font-size="19" fill="#222">F  D  I</text><text x="215" y="578" text-anchor="middle" font-size="19" fill="#222">B  NL  L</text><text x="215" y="612" text-anchor="middle" font-size="19" fill="#222">VB  DK  IRL</text><text x="470" y="545" text-anchor="middle" font-size="19" fill="#222">A  CH  P</text><text x="470" y="580" text-anchor="middle" font-size="19" fill="#222">S  N  IS  FIN</text><text x="470" y="616" text-anchor="middle" font-size="16" fill="#C0392B">ostala EFTA</text><rect x="20" y="705" width="600" height="140" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="735" font-size="18.5" fill="#1F5FC4" >modro = carinska unija EGS (skupna zunanja carina)</text><text x="38" y="766" font-size="18.5" fill="#C0392B" >rdeče = prosta trgovina z industrijskimi izdelki</text><text x="38" y="797" font-size="18.5" fill="#222" >1973: VB, DK (in IRL) iz EFTA v EGS + sporazumi FTA</text><text x="38" y="828" font-size="18.5" fill="#222" >zunaj ostaneta Španija in Grčija (diktaturi)</text></svg>