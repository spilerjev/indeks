<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Vaje 3, naloga 3: trg plaščev pred in po mednarodni menjavi</text>

  <!-- ===== NEMČIJA ===== -->
  <text x="210" y="62" text-anchor="middle" font-size="16" font-weight="bold">Nemčija (uvoznica)</text>
  <polygon points="160,290 260,290 210,240" fill="#7CB342" fill-opacity="0.45"/>
  <line x1="60" y1="440" x2="380" y2="440" stroke="#222" stroke-width="2"/>
  <line x1="60" y1="440" x2="60" y2="70" stroke="#222" stroke-width="2"/>
  <text x="372" y="462" font-size="13">Q (10³)</text><text x="30" y="80" font-size="13">P (€)</text>
  <line x1="60" y1="90" x2="360" y2="390" stroke="#222" stroke-width="2.5"/><text x="345" y="385" font-size="16" font-weight="bold">D</text>
  <line x1="60" y1="390" x2="360" y2="90" stroke="#C0392B" stroke-width="2.5"/><text x="345" y="88" font-size="16" font-weight="bold" fill="#C0392B">S</text>
  <line x1="60" y1="290" x2="380" y2="290" stroke="#1F5FC4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="300" y="283" font-size="13" fill="#1F5FC4">P_W = 150</text>
  <g stroke="#888" stroke-dasharray="3 4">
    <line x1="60" y1="240" x2="210" y2="240"/><line x1="210" y1="240" x2="210" y2="440"/>
    <line x1="160" y1="290" x2="160" y2="440"/><line x1="260" y1="290" x2="260" y2="440"/>
  </g>
  <circle cx="210" cy="240" r="5" fill="#222"/><text x="216" y="232" font-size="13" font-weight="bold">E (75; 200)</text>
  <line x1="162" y1="310" x2="258" y2="310" stroke="#1F5FC4" stroke-width="2"/>
  <polygon points="258,310 250,305 250,315" fill="#1F5FC4"/><polygon points="162,310 170,305 170,315" fill="#1F5FC4"/>
  <text x="210" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F5FC4">uvoz 50</text>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="160" y="456">50</text><text x="210" y="456">75</text><text x="260" y="456">100</text><text x="56" y="456">0</text>
  </g>
  <g font-size="12" fill="#444" text-anchor="end">
    <text x="54" y="244">200</text><text x="54" y="294">150</text><text x="54" y="94">350</text><text x="54" y="394">50</text>
  </g>

  <!-- ===== ITALIJA (ista lestvica cen kot Nemčija: Y = 440 − P) ===== -->
  <text x="670" y="62" text-anchor="middle" font-size="16" font-weight="bold">Italija (izvoznica)</text>
  <polygon points="570,290 670,290 620,315" fill="#7CB342" fill-opacity="0.45"/>
  <line x1="520" y1="440" x2="850" y2="440" stroke="#222" stroke-width="2"/>
  <line x1="520" y1="440" x2="520" y2="70" stroke="#222" stroke-width="2"/>
  <text x="840" y="462" font-size="13">Q (10³)</text><text x="490" y="80" font-size="13">P (€)</text>
  <line x1="520" y1="265" x2="820" y2="415" stroke="#222" stroke-width="2.5"/><text x="805" y="405" font-size="16" font-weight="bold">D</text>
  <line x1="520" y1="365" x2="820" y2="215" stroke="#C0392B" stroke-width="2.5"/><text x="805" y="210" font-size="16" font-weight="bold" fill="#C0392B">S</text>
  <line x1="520" y1="290" x2="850" y2="290" stroke="#1F5FC4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="770" y="283" font-size="13" fill="#1F5FC4">P_W = 150</text>
  <g stroke="#888" stroke-dasharray="3 4">
    <line x1="520" y1="315" x2="620" y2="315"/><line x1="620" y1="315" x2="620" y2="440"/>
    <line x1="570" y1="290" x2="570" y2="440"/><line x1="670" y1="290" x2="670" y2="440"/>
  </g>
  <circle cx="620" cy="315" r="5" fill="#222"/><text x="628" y="337" font-size="13" font-weight="bold">E (50; 125)</text>
  <line x1="572" y1="272" x2="668" y2="272" stroke="#E67E22" stroke-width="2"/>
  <polygon points="668,272 660,267 660,277" fill="#E67E22"/><polygon points="572,272 580,267 580,277" fill="#E67E22"/>
  <text x="620" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#E67E22">izvoz 50</text>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="570" y="456">25</text><text x="620" y="456">50</text><text x="670" y="456">75</text><text x="516" y="456">0</text>
  </g>
  <g font-size="12" fill="#444" text-anchor="end">
    <text x="514" y="294">150</text><text x="514" y="319">125</text><text x="514" y="269">175</text><text x="514" y="369">75</text>
  </g>
  <line x1="380" y1="290" x2="520" y2="290" stroke="#1F5FC4" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- legend -->
  <g font-size="13" fill="#333">
    <rect x="60" y="485" width="16" height="12" fill="#7CB342" fill-opacity="0.45"/>
    <text x="82" y="496">neto korist menjave (naloga 4): Nemčija ½·50·50 = 1.250 · 10³ €, Italija ½·25·50 = 625 · 10³ €</text>
  </g>
</svg>
