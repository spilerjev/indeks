e="16.4" font-weight="bold" fill="#222">MD</text><line x1="245" y1="275" x2="347" y2="185" stroke="#C0392B" stroke-width="2.8"/><text x="351" y="189" font-size="16.4" font-weight="bold" fill="#C0392B">XS</text><line x1="296" y1="230" x2="296" y2="410" stroke="#888" stroke-dasharray="5 5"/><text x="296" y="428.04" text-anchor="middle" font-size="13.94" fill="#333">M = X</text><circle cx="296" cy="230" r="5" fill="#222"/><text x="535" y="96" text-anchor="middle" font-size="15.579999999999998" font-weight="bold" fill="#333">Domača država (H)</text><polygon points="467.0,230.0 492.5,185.0 518.0,230.0" fill="#F2C94C" fill-opacity="0.6" stroke="#555" stroke-width="0.6"/><line x1="450" y1="410" x2="620" y2="410" stroke="#222" stroke-width="2.2"/><line x1="450" y1="410" x2="450" y2="110" stroke="#222" stroke-width="2.2"/><text x="616" y="429.68" text-anchor="end" font-size="13.94" fill="#222">Q</text><text x="442" y="114" text-anchor="end" font-size="13.94" fill="#222">P</text><line x1="450" y1="110" x2="620" y2="410" stroke="#222" stroke-width="2.8"/><text x="616" y="402" text-anchor="end" font-size="16.4" font-weight="bold" fill="#222">D</text><line x1="450" y1="260" x2="535" y2="110" stroke="#C0392B" stroke-width="2.8"/><text x="539" y="114" font-size="16.4" font-weight="bold" fill="#C0392B">S</text><text x="492.5" y="225" text-anchor="middle" font-size="15.579999999999998" font-weight="bold" fill="#222">IM</text><circle cx="492.5" cy="185" r="5" fill="#222"/><line x1="40" y1="230" x2="620" y2="230" stroke="#1F5FC4" stroke-width="2" stroke-dasharray="6 4"/><text x="632" y="236" text-anchor="end" font-size="15" font-weight="bold" fill="#1F5FC4">P_W</text><rect x="20" y="450" width="600" height="171" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="480" font-size="18.5" fill="#222" >F: avtarkična cena nizka (P_F*) → pri P_W izvaža (EX)</text><text x="38" y="511" font-size="18.5" fill="#222" >H: avtarkična cena visoka (P_H*) → pri P_W uvaža (IM)</text><text x="38" y