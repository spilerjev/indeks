<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 668" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="668" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Učinek domin (Baldwin, 1993)</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P01: zakaj se integracija sama širi</text><rect x="40" y="84" width="520" height="60" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="64" y="122" font-size="21" font-weight="bold" fill="#1F5FC4">1.</text><text x="96" y="122" font-size="19.5" fill="#222">Blok zniža carine samo za članice</text><line x1="300" y1="144" x2="300" y2="160" stroke="#555" stroke-width="2.5"/><polygon points="294,158 306,158 300,167" fill="#555"/><rect x="40" y="168" width="520" height="60" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="64" y="206" font-size="21" font-weight="bold" fill="#1F5FC4">2.</text><text x="96" y="206" font-size="19.5" fill="#222">Outsiderji so diskriminirani</text><line x1="300" y1="228" x2="300" y2="244" stroke="#555" stroke-width="2.5"/><polygon points="294,242 306,242 300,251" fill="#555"/><rect x="40" y="252" width="520" height="60" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="64" y="290" font-size="21" font-weight="bold" fill="#1F5FC4">3.</text><text x="96" y="290" font-size="19.5" fill="#222">Izvozniki outsiderjev lobirajo za vstop</text><line x1="300" y1="312" x2="300" y2="328" stroke="#555" stroke-width="2.5"/><polygon points="294,326 306,326 300,335" fill="#555"/><rect x="40" y="336" width="520" height="60" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="64" y="374" font-size="21" font-weight="bold" fill="#1F5FC4">4.</text><text x="96" y="374" font-size="19.5" fill="#222">Nova država vstopi → blok je večji</text><line x1="300" y1="396" x2="300" y2="412" stroke="#555" stroke-width="2.5"/><polygon points="294,410 306,410 300,419" fill="#555"/><rect x="40" y="420" width="520" height="60" rx="12" fill="#F8E1D6" stroke="#B5651D" stroke-width="1.8"/><text x="64" y="458" font-size="21" font-weight="bold" fill="#1F5FC4">5.</text><text x="96" y="458" font-size="19.5" fill="#222">Diskriminacija ostalih je še večja</text><path d="M560 450 C 625 450, 625 114, 566 114" fill="none" stroke="#B5651D" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="562,114 574,108 574,120" fill="#B5651D"/><rect x="20" y="512" width="600" height="140" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="542" font-size="18.5" fill="#222" font-weight="bold">Domino 1: EGS raste hitreje → VB (1961), DK, IRL, N</text><text x="38" y="573" font-size="18.5" fill="#222" >   zaprosijo za članstvo → širitev 1973</text><text x="38" y="604" font-size="18.5" fill="#222" font-weight="bold">Domino 2: enotni trg (EC92) → odtok TNI iz EFTA</text><text x="38" y="635" font-size="18.5" fill="#222" >   → EEA (1994) → širitev 1995 (A, S, FIN)</text></svg>