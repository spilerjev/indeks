ostna</text><text x="320" y="390" text-anchor="middle" font-size="18" fill="#333">politika</text><text x="320" y="484" text-anchor="middle" font-size="17" font-weight="bold" fill="#B5651D">medvladno</text><rect x="430" y="162" width="180" height="340" fill="#F8E1D6" stroke="#B5651D" stroke-width="2"/><text x="520" y="192" text-anchor="middle" font-size="18" fill="#B5651D" font-weight="bold">3. steber</text><text x="520" y="224" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">PNZ</text><text x="520" y="300" text-anchor="middle" font-size="18" fill="#333">pravosodje</text><text x="520" y="330" text-anchor="middle" font-size="18" fill="#333">in notranje</text><text x="520" y="360" text-anchor="middle" font-size="18" fill="#333">zadeve</text><text x="520" y="390" text-anchor="middle" font-size="18" fill="#333">(od 1999 PJSZ)</text><text x="520" y="484" text-anchor="middle" font-size="17" font-weight="bold" fill="#B5651D">medvladno</text><rect x="15" y="508" width="610" height="36" fill="#E8E2D5" stroke="#8a6d2b"/><text x="320" y="533" text-anchor="middle" font-size="18" fill="#333">temelj: Pogodba o EU + Pogodba o ES</text><text x="320" y="576" text-anchor="middle" font-size="17" fill="#555">Lizbona (2009): stebri ukinjeni, EU dobi pravno osebnost.</text></svg>