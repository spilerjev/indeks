<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="470" fill="#fff"/><text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Tristebrna zgradba EU (Maastricht 1993 – Lizbona 2009)</text><polygon points="450,48 860,128 40,128" fill="#F6E7C8" stroke="#8a6d2b" stroke-width="2"/><text x="450" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#5b4310">EVROPSKA UNIJA</text><rect x="80" y="140" width="220" height="250" fill="#D9EAF7" stroke="#1F5FC4" stroke-width="2"/><text x="190" y="168" text-anchor="middle" font-size="15" fill="#1F5FC4" font-weight="bold">1. steber</text><text x="190" y="194" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Evropske skupnosti</text><text x="190" y="232" text-anchor="middle" font-size="14" fill="#333">ES (prej EGS), ESPJ, Euratom</text><text x="190" y="256" text-anchor="middle" font-size="14" fill="#333">enotni trg, carinska unija</text><text x="190" y="280" text-anchor="middle" font-size="14" fill="#333">EMU, kmetijstvo (SKP)</text><text x="190" y="304" text-anchor="middle" font-size="14" fill="#333">od Amsterdama: azil, vize</text><text x="190" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F5FC4">NADNACIONALNO</text><rect x="340" y="140" width="220" height="250" fill="#F8E1D6" stroke="#B5651D" stroke-width="2"/><text x="450" y="168" text-anchor="middle" font-size="15" fill="#B5651D" font-weight="bold">2. steber</text><text x="450" y="194" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">SZVP</text><text x="450" y="232" text-anchor="middle" font-size="14" fill="#333">skupna zunanja in</text><text x="450" y="256" text-anchor="middle" font-size="14" fill="#333">varnostna politika</text><text x="450" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#B5651D">MEDVLADNO</text><rect x="600" y="140" width="220" height="250" fill="#F8E1D6" stroke="#B5651D" stroke-width="2"/><text x="710" y="168" text-anchor="middle" font-size="15" fill="#B5651D" font-weight="bold">3. steber</text><text x="710" y="194" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">PNZ → PJSZ</text><text x="710" y="232" text-anchor="middle" font-size="14" fill="#333">pravosodje in notranje zadeve</text><text x="710" y="256" text-anchor="middle" font-size="14" fill="#333">od Amsterdama: policijsko in</text><text x="710" y="280" text-anchor="middle" font-size="14" fill="#333">pravosodno sodelovanje</text><text x="710" y="304" text-anchor="middle" font-size="14" fill="#333">v kazenskih zadevah</text><text x="710" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#B5651D">MEDVLADNO</text><rect x="40" y="396" width="820" height="28" fill="#E8E2D5" stroke="#8a6d2b"/><text x="450" y="415" text-anchor="middle" font-size="14" fill="#333">temelj: Pogodba o EU (Maastricht) + Pogodba o ES (Rim)</text><text x="450" y="452" text-anchor="middle" font-size="13" fill="#555">Lizbonska pogodba (2009) stebre ukine: EU dobi pravno osebnost, temelj postaneta PEU in PDEU.</text></svg>