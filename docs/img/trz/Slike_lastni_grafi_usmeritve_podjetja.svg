<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 728" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="728" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Usmeritve podjetja na trg</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P01: od »kaj znamo narediti« do »kaj potrebuje porabnik«</text><rect x="70" y="84" width="550" height="72" rx="12" fill="#F1EFE8" stroke="#888" stroke-width="1.8"/><text x="86" y="113"  font-size="20" font-weight="bold" fill="#444">Proizvodna</text><text x="86" y="139"  font-size="17" fill="#333">poceni in dosegljivi izdelki, notranji stroški</text><rect x="70" y="170" width="550" height="72" rx="12" fill="#F1EFE8" stroke="#888" stroke-width="1.8"/><text x="86" y="199"  font-size="20" font-weight="bold" fill="#444">Izdelčna</text><text x="86" y="225"  font-size="17" fill="#333">kakovost in tehnika → trženjska kratkovidnost</text><rect x="70" y="256" width="550" height="72" rx="12" fill="#F8E1D6" stroke="#B5651D" stroke-width="1.8"/><text x="86" y="285"  font-size="20" font-weight="bold" fill="#B5651D">Prodajna</text><text x="86" y="311"  font-size="17" fill="#333">»prodati, kar imamo«, agresivna prodaja</text><rect x="70" y="342" width="550" height="72" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="86" y="371"  font-size="20" font-weight="bold" fill="#1F5FC4">Trženjska</text><text x="86" y="397"  font-size="17" fill="#333">najprej potrebe ciljnega trga, nato izdelek</text><rect x="70" y="428" width="550" height="72" rx="12" fill="#E2F3E8" stroke="#2E7D32" stroke-width="1.8"/><text x="86" y="457"  font-size="20" font-weight="bold" fill="#2E7D32">Družbeno odgovorna trž.</text><text x="86" y="483"  font-size="17" fill="#333">+ dolgoročna blaginja družbe</text><rect x="70" y="514" width="550" height="72" rx="12" fill="#EEE6F7" stroke="#6A1B9A" stroke-width="1.8"/><text x="86" y="543"  font-size="20" font-weight="bold" fill="#6A1B9A">Usmeritev v porabnika</text><text x="86" y="569"  font-size="17" fill="#333">po meri posameznika, »eden za enega«</text><line x1="38" y1="90" x2="38" y2="574" stroke="#888" stroke-width="3"/><polygon points="31,570 45,570 38,584" fill="#888"/><rect x="20" y="612" width="600" height="109" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="642" font-size="18.5" fill="#222" >Prvi dve gledata vase, prodajna potiska izdelek,</text><text x="38" y="673" font-size="18.5" fill="#222" >trženjska začne pri potrebah porabnika.</text><text x="38" y="704" font-size="18.5" fill="#C0392B" font-weight="bold">Past: »najprej ciljni trg, nato izdelek« = trženjska!</text></svg>