<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 694" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="694" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Tri ravni izdelka</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P06: od znotraj navzven (primer: fotoaparat)</text><circle cx="320" cy="300" r="215" fill="#F8E1D6" stroke="#B5651D" stroke-width="2.5"/><circle cx="320" cy="300" r="145" fill="#E3EEF9" stroke="#4a78b0" stroke-width="2.5"/><circle cx="320" cy="300" r="68" fill="#E2F3E8" stroke="#2E7D32" stroke-width="2.5"/><text x="320" y="293" text-anchor="middle" font-size="19" font-weight="bold" fill="#2E7D32">JEDRO</text><text x="320" y="316" text-anchor="middle" font-size="16" fill="#333">spomini</text><text x="320" y="186" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F5FC4">PRIČAKOVANI</text><text x="320" y="400" text-anchor="middle" font-size="15.5" fill="#333">objektiv, baterija,</text><text x="320" y="420" text-anchor="middle" font-size="15.5" fill="#333">znamka, embalaža</text><text x="320" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#B5651D">RAZŠIRJENI</text><text x="320" y="478" text-anchor="middle" font-size="15.5" fill="#333">garancija, dostava,</text><text x="320" y="498" text-anchor="middle" font-size="15.5" fill="#333">aplikacija, servis</text><rect x="20" y="536" width="600" height="140" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="566" font-size="18.5" fill="#2E7D32" >jedro = osnovna korist, ki jo porabnik v resnici kupi</text><text x="38" y="597" font-size="18.5" fill="#1F5FC4" >pričakovani = lastnosti, ki jih po navadi pričakuje</text><text x="38" y="628" font-size="18.5" fill="#B5651D" >razširjeni = dodatne koristi nad pričakovanji</text><text x="38" y="659" font-size="18.5" fill="#222" font-weight="bold">Konkurenca danes: na ravni RAZŠIRJENEGA izdelka</text></svg>