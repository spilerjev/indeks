<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 750" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="750" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Model vedenja porabnikov</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">6 procesov</text><rect x="60" y="80" width="470" height="70" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="295" y="109" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F5FC4">1. Prepoznavanje potreb</text><text x="295" y="134" text-anchor="middle" font-size="17" fill="#333">sproži ga dražljaj</text><line x1="295" y1="150" x2="295" y2="164" stroke="#555" stroke-width="2.5"/><polygon points="288,162 302,162 295,172" fill="#555"/><rect x="60" y="172" width="470" height="70" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="295" y="201" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F5FC4">2. Komunikacijske poti</text><text x="295" y="226" text-anchor="middle" font-size="17" fill="#333">od kod dobi informacije</text><line x1="295" y1="242" x2="295" y2="256" stroke="#555" stroke-width="2.5"/><polygon points="288,254 302,254 295,264" fill="#555"/><rect x="60" y="264" width="470" height="70" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="295" y="293" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F5FC4">3. + 4. Značilnosti porabnika</text><text x="295" y="318" text-anchor="middle" font-size="17" fill="#333">in proces odločanja</text><line x1="295" y1="334" x2="295" y2="348" stroke="#555" stroke-width="2.5"/><polygon points="288,346 302,346 295,356" fill="#555"/><rect x="60" y="356" width="470" height="70" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="295" y="385" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F5FC4">5. Nakupna odločitev</text><text x="295" y="410" text-anchor="middle" font-size="17" fill="#333">kupi / ne kupi</text><line x1="295" y1="426" x2="295" y2="440" stroke="#555" stroke-width="2.5"/><polygon points="288,438 302,438 295,448" fill="#555"/><rect x="60" y="448" width="470" height="70" rx="12" fill="#F8E1D6" stroke="#B5651D" stroke-width="1.8"/><text x="295" y="477" text-anchor="middle" font-size="20" font-weight="bold" fill="#B5651D">6. Ponakupni občutki</text><text x="295" y="502" text-anchor="middle" font-size="17" fill="#333">izkušnja → nazaj v 3–4</text><path d="M530 483 C 600 483, 600 299, 538 299" fill="none" stroke="#B5651D" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="532,299 544,292 544,306" fill="#B5651D"/><text x="320" y="560" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">Proces odločanja (4):</text><rect x="20" y="578" width="180" height="62" rx="12" fill="#F1EFE8" stroke="#888" stroke-width="1.8"/><text x="110" y="605" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">presojanje</text><text x="110" y="629" text-anchor="middle" font-size="15.5" fill="#333">koristi, lastnosti</text><line x1="200" y1="609" x2="222" y2="609" stroke="#555" stroke-width="2.5"/><polygon points="220,602 220,616 230,609" fill="#555"/><rect x="230" y="578" width="170" height="62" rx="12" fill="#F1EFE8" stroke="#888" stroke-width="1.8"/><text x="315" y="605" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">nakupna</text><text x="315" y="629" text-anchor="middle" font-size="15.5" fill="#333">namera</text><line x1="400" y1="609" x2="422" y2="609" stroke="#555" stroke-width="2.5"/><polygon points="420,602 420,616 430,609" fill="#555"/><rect x="430" y="578" width="190" height="62" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="525" y="605" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F5FC4">nakupna</text><text x="525" y="629" text-anchor="middle" font-size="15.5" fill="#333">odločitev</text><text x="415" y="668" text-anchor="middle" font-size="16" fill="#C0392B">↑ stališča drugih, nepričakovane okoliščine</text><rect x="20" y="686" width="600" height="47" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="716" font-size="18.5" fill="#222" font-weight="bold">Nakupna namera ≠ nakupna odločitev</text></svg>