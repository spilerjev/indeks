<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 596" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="596" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Ciljno trženje: S → T → P</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">trije koraki</text><rect x="60" y="82" width="520" height="108" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="320" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F5FC4">1. SEGMENTIRANJE</text><text x="320" y="146" text-anchor="middle" font-size="18" fill="#333">spremenljivke za segmentiranje</text><text x="320" y="170" text-anchor="middle" font-size="18" fill="#333">profili segmentov</text><line x1="320" y1="190" x2="320" y2="210" stroke="#555" stroke-width="2.5"/><polygon points="313,208 327,208 320,218" fill="#555"/><rect x="60" y="218" width="520" height="108" rx="12" fill="#E2F3E8" stroke="#2E7D32" stroke-width="1.8"/><text x="320" y="252" text-anchor="middle" font-size="20" font-weight="bold" fill="#2E7D32">2. CILJANJE</text><text x="320" y="282" text-anchor="middle" font-size="18" fill="#333">privlačnost segmentov</text><text x="320" y="306" text-anchor="middle" font-size="18" fill="#333">izbira ciljnih trgov</text><line x1="320" y1="326" x2="320" y2="346" stroke="#555" stroke-width="2.5"/><polygon points="313,344 327,344 320,354" fill="#555"/><rect x="60" y="354" width="520" height="108" rx="12" fill="#F8E1D6" stroke="#B5651D" stroke-width="1.8"/><text x="320" y="388" text-anchor="middle" font-size="20" font-weight="bold" fill="#B5651D">3. POZICIONIRANJE</text><text x="320" y="418" text-anchor="middle" font-size="18" fill="#333">pozicija za vsak ciljni segment</text><text x="320" y="442" text-anchor="middle" font-size="18" fill="#333">trženjski splet za segment</text><rect x="20" y="500" width="600" height="78" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="530" font-size="18.5" fill="#222" >včasih: množično trženje (isto vsem)</text><text x="38" y="561" font-size="18.5" fill="#222" >danes: izbrane ciljne skupine (persona)</text></svg>