<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 744" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="744" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Trženjsko okolje</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P03: mikro (lahko vplivamo) in makro (ne moremo vplivati)</text><circle cx="320" cy="345" r="265" fill="#F8E1D6" stroke="#B5651D" stroke-width="2.5"/><circle cx="320" cy="345" r="160" fill="#E3EEF9" stroke="#4a78b0" stroke-width="2.5"/><circle cx="320" cy="345" r="62" fill="#fff" stroke="#222" stroke-width="2"/><text x="320" y="352" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Podjetje</text><text x="320" y="139" text-anchor="middle" font-size="15.5" fill="#B5651D" font-weight="bold">ekonomski</text><text x="504" y="245" text-anchor="middle" font-size="15.5" fill="#B5651D" font-weight="bold">demografski</text><text x="504" y="457" text-anchor="middle" font-size="15.5" fill="#B5651D" font-weight="bold">sociokulturni</text><text x="320" y="563" text-anchor="middle" font-size="15.5" fill="#B5651D" font-weight="bold">regulativa</text><text x="136" y="457" text-anchor="middle" font-size="15.5" fill="#B5651D" font-weight="bold">tehnološki</text><text x="136" y="245" text-anchor="middle" font-size="15.5" fill="#B5651D" font-weight="bold">naravno okolje</text><text x="320" y="239" text-anchor="middle" font-size="15" fill="#1F5FC4" font-weight="bold">porabniki</text><text x="417" y="295" text-anchor="middle" font-size="15" fill="#1F5FC4" font-weight="bold">konkurenti</text><text x="417" y="407" text-anchor="middle" font-size="15" fill="#1F5FC4" font-weight="bold">dobavitelji</text><text x="320" y="463" text-anchor="middle" font-size="15" fill="#1F5FC4" font-weight="bold">posredniki</text><text x="223" y="407" text-anchor="middle" font-size="15" fill="#1F5FC4" font-weight="bold">javnosti</text><text x="223" y="295" text-anchor="middle" font-size="15" fill="#1F5FC4" font-weight="bold">prednosti podj.</text><text x="320" y="113" text-anchor="middle" font-size="13" fill="#B5651D" letter-spacing="2">MAKRO (PESTEL)</text><text x="320" y="205" text-anchor="middle" font-size="13" fill="#4a78b0" letter-spacing="2">MIKRO</text><rect x="20" y="626" width="600" height="109" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="656" font-size="18.5" fill="#1F5FC4" >mikro: akterji ob podjetju, nanje lahko vplivamo</text><text x="38" y="687" font-size="18.5" fill="#B5651D" >makro: širše sile, spremljamo in se prilagajamo</text><text x="38" y="718" font-size="18.5" fill="#C0392B" font-weight="bold">Past: konkurenti in porabniki = MIKRO</text></svg>