<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="670" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Strateški trženjski načrt</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">P02: 7 sestavin</text><rect x="70" y="80" width="500" height="52" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="320" y="113" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F5FC4">1. Poslanstvo</text><line x1="320" y1="132" x2="320" y2="142" stroke="#555" stroke-width="2.5"/><polygon points="313,140 327,140 320,150" fill="#555"/><rect x="70" y="150" width="500" height="52" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="320" y="183" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F5FC4">2. Strateške analize (zunanje + notranje)</text><line x1="320" y1="202" x2="320" y2="212" stroke="#555" stroke-width="2.5"/><polygon points="313,210 327,210 320,220" fill="#555"/><rect x="70" y="220" width="500" height="52" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="320" y="253" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F5FC4">3. Trženjski cilji</text><line x1="320" y1="272" x2="320" y2="282" stroke="#555" stroke-width="2.5"/><polygon points="313,280 327,280 320,290" fill="#555"/><rect x="70" y="290" width="500" height="52" rx="12" fill="#F8E1D6" stroke="#B5651D" stroke-width="1.8"/><text x="320" y="323" text-anchor="middle" font-size="19" font-weight="bold" fill="#B5651D">4. Trženjske strategije (STP + splet)</text><line x1="320" y1="342" x2="320" y2="352" stroke="#555" stroke-width="2.5"/><polygon points="313,350 327,350 320,360" fill="#555"/><rect x="70" y="360" width="500" height="52" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="320" y="393" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F5FC4">5. Trženjski programi (proračun)</text><line x1="320" y1="412" x2="320" y2="422" stroke="#555" stroke-width="2.5"/><polygon points="313,420 327,420 320,430" fill="#555"/><rect x="70" y="430" width="500" height="52" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="320" y="463" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F5FC4">6. Finančne projekcije</text><line x1="320" y1="482" x2="320" y2="492" stroke="#555" stroke-width="2.5"/><polygon points="313,490 327,490 320,500" fill="#555"/><rect x="70" y="500" width="500" height="52" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="320" y="533" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F5FC4">7. Spremljanje in nadzor</text><rect x="20" y="574" width="600" height="78" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="604" font-size="18.5" fill="#222" >sodobno: najti ciljni trg → razviti izdelek → sporočiti vrednost</text><text x="38" y="635" font-size="18.5" fill="#222" >(tradicionalno: izdelati → prodati)</text></svg>