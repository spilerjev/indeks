<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 586" font-family="Helvetica, Arial, sans-serif"><rect width="640" height="586" fill="#fff"/><text x="320" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Storitve: 4 značilnosti in 7P</text><text x="320" y="60" text-anchor="middle" font-size="16.5" fill="#666">dodatni 3P odgovarjajo na značilnosti storitev</text><rect x="20" y="84" width="260" height="58" rx="12" fill="#F8E1D6" stroke="#B5651D" stroke-width="1.8"/><text x="150" y="120" text-anchor="middle" font-size="19" font-weight="bold" fill="#B5651D">Neopredmetenost</text><rect x="20" y="158" width="260" height="58" rx="12" fill="#F8E1D6" stroke="#B5651D" stroke-width="1.8"/><text x="150" y="194" text-anchor="middle" font-size="19" font-weight="bold" fill="#B5651D">Neločljivost</text><rect x="20" y="232" width="260" height="58" rx="12" fill="#F8E1D6" stroke="#B5651D" stroke-width="1.8"/><text x="150" y="268" text-anchor="middle" font-size="19" font-weight="bold" fill="#B5651D">Spremenljivost</text><rect x="20" y="306" width="260" height="58" rx="12" fill="#F8E1D6" stroke="#B5651D" stroke-width="1.8"/><text x="150" y="342" text-anchor="middle" font-size="19" font-weight="bold" fill="#B5651D">Minljivost</text><rect x="360" y="84" width="260" height="150" rx="12" fill="#F1EFE8" stroke="#888" stroke-width="1.8"/><text x="490" y="114" text-anchor="middle" font-size="20" font-weight="bold" fill="#444">4P (klasično)</text><text x="490" y="142" text-anchor="middle" font-size="17" fill="#333">izdelek / storitev</text><text x="490" y="167" text-anchor="middle" font-size="17" fill="#333">cena</text><text x="490" y="192" text-anchor="middle" font-size="17" fill="#333">tržne poti</text><text x="490" y="217" text-anchor="middle" font-size="17" fill="#333">trženjsko komuniciranje</text><rect x="360" y="250" width="260" height="58" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="490" y="286" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#1F5FC4">ljudje (people)</text><rect x="360" y="320" width="260" height="58" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="490" y="356" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#1F5FC4">proces</text><rect x="360" y="390" width="260" height="58" rx="12" fill="#E3EEF9" stroke="#4a78b0" stroke-width="1.8"/><text x="490" y="426" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#1F5FC4">fizični dokazi</text><line x1="280" y1="113" x2="356" y2="419" stroke="#6A1B9A" stroke-width="2" stroke-dasharray="6 4"/><line x1="280" y1="187" x2="356" y2="279" stroke="#6A1B9A" stroke-width="2" stroke-dasharray="6 4"/><line x1="280" y1="187" x2="356" y2="349" stroke="#6A1B9A" stroke-width="2" stroke-dasharray="6 4"/><line x1="280" y1="261" x2="356" y2="279" stroke="#6A1B9A" stroke-width="2" stroke-dasharray="6 4"/><line x1="280" y1="261" x2="356" y2="349" stroke="#6A1B9A" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="476" width="600" height="109" rx="10" fill="#f7f4ee" stroke="#d8cfbd"/><text x="38" y="506" font-size="18.5" fill="#222" >neopredmetenost → fizični dokazi</text><text x="38" y="537" font-size="18.5" fill="#222" >neločljivost, spremenljivost → ljudje in proces</text><text x="38" y="568" font-size="18.5" fill="#222" >minljivost → usklajevanje ponudbe in povpraševanja</text></svg>